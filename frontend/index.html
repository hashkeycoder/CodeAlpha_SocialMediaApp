<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialApp — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box" id="loginBox">
      <h1>Welcome Back</h1>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p id="loginError" class="error"></p>
      <p class="switch"><a href="forgot-password.html">Forgot Password?</a></p>
      <p class="switch">New here? <a href="#" id="showRegister">Create an account</a></p>
    </div>

    <div class="auth-box hidden" id="registerBox">
      <h1>Join SocialApp</h1>
      <form id="registerForm">
        <input type="text" id="registerName" placeholder="Full Name" required>
        <input type="text" id="registerUsername" placeholder="Username" required>
        <input type="email" id="registerEmail" placeholder="Email" required>
        <input type="password" id="registerPassword" placeholder="Password" required minlength="6">
        <button type="submit">Register</button>
      </form>
      <p id="registerError" class="error"></p>
      <p class="switch">Already have an account? <a href="#" id="showLogin">Login</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
