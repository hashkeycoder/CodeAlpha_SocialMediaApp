<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialApp — Search</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body>
  <nav class="navbar">
    <h2>SocialApp</h2>
    <div class="nav-links">
      <a href="feed.html">Feed</a>
      <a href="search.html">Search</a>
      <a href="messages.html">Messages</a>
      <a href="notifications.html">Notifications<span id="notifBadge" class="nav-badge" style="display:none;"></span></a>
      <a href="profile.html" id="myProfileLink">Profile</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="page-container">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search people, posts, or #hashtags...">
      <button id="searchBtn" type="button">Search</button>
    </div>

    <div class="search-tabs">
      <button class="tab-btn active" data-type="all">All</button>
      <button class="tab-btn" data-type="users">People</button>
      <button class="tab-btn" data-type="posts">Posts</button>
      <button class="tab-btn" data-type="hashtags">Hashtags</button>
    </div>

    <div id="searchResults"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
